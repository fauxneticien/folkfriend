services:
  folkfriend:
    build: .
    working_dir: /app/rust
    volumes:
      - ./:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/rust/target
      - folkfriend-cache:/root/.folkfriend
    # Run cargo commands explicitly, e.g.:
    #   docker compose run --rm folkfriend cargo run -- query wavs/your_file.wav
    command: sleep infinity

volumes:
  cargo-registry:
  cargo-target:
  folkfriend-cache:
